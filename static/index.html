<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realtime Voice Task Manager</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe5;
        --panel: #fffaf3;
        --accent: #17624d;
        --accent-soft: #d7efe6;
        --text: #1d2a25;
        --muted: #62716a;
        --border: #d6d0c7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, #fff6cf 0, transparent 25%),
          radial-gradient(circle at bottom right, #dfeee4 0, transparent 30%),
          var(--bg);
        color: var(--text);
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 20px 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      .lead {
        margin: 0 0 24px;
        color: var(--muted);
        max-width: 60ch;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
      }

      .panel {
        background: color-mix(in srgb, var(--panel) 92%, white 8%);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 16px 40px rgba(29, 42, 37, 0.08);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      button,
      select,
      input {
        border-radius: 999px;
        border: 1px solid var(--border);
        padding: 12px 16px;
        font: inherit;
      }

      button {
        background: white;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      button:disabled,
      select:disabled,
      input:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        background: #a1462a;
      }

      .status-dot.live {
        background: #2e9a56;
      }

      .conversation,
      .tasks,
      .events {
        min-height: 320px;
        max-height: 440px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .bubble {
        padding: 12px 14px;
        border-radius: 16px;
        line-height: 1.4;
      }

      .bubble.user {
        background: white;
        align-self: flex-end;
      }

      .bubble.assistant {
        background: var(--accent-soft);
        align-self: flex-start;
      }

      .meta {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .task {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: white;
      }

      .toolbar {
        margin-bottom: 16px;
      }

      .text-entry {
        margin-top: 14px;
        display: flex;
        gap: 10px;
      }

      .text-entry input {
        flex: 1;
      }

      .camera-card {
        margin: 0 0 16px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #eee7dc;
      }

      .camera-stage {
        position: relative;
        overflow: hidden;
        min-height: 180px;
        margin-bottom: 10px;
        border-radius: 12px;
        background: #1d2a25;
      }

      .camera-stage video {
        display: block;
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        transform: scaleX(-1);
      }

      .camera-placeholder {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        color: #d7efe6;
        text-align: center;
      }

      .camera-stage.active .camera-placeholder {
        display: none;
      }

      .camera-heading {
        justify-content: space-between;
        margin-bottom: 10px;
      }

      a {
        color: var(--accent);
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Realtime voice task assistant</h1>
      <p class="lead">
        Talk naturally, manage tasks, search the web, or turn on the camera and ask what it sees.
      </p>

      <div class="grid">
        <section class="panel">
          <div class="toolbar row">
            <span class="meta"><span id="statusDot" class="status-dot"></span><span id="statusText">Disconnected</span></span>
            <select id="voiceSelect">
              <option>Kore</option>
              <option>Puck</option>
              <option>Aoede</option>
              <option>Charon</option>
              <option>Fenrir</option>
              <option>Leda</option>
              <option>Orus</option>
              <option>Zephyr</option>
            </select>
            <button id="connectBtn" class="primary">Start conversation</button>
            <button id="disconnectBtn" disabled>Stop</button>
          </div>

          <div class="camera-card">
            <div class="row camera-heading">
              <h2>Camera vision</h2>
              <span id="cameraStatus" class="meta">Camera off</span>
            </div>
            <div id="cameraStage" class="camera-stage">
              <video id="cameraPreview" autoplay muted playsinline></video>
              <div class="camera-placeholder">Start the camera, hold up an object, then ask “What is this?”</div>
            </div>
            <canvas id="cameraCanvas" hidden></canvas>
            <div class="row">
              <button id="startCameraBtn" disabled>Start camera</button>
              <button id="stopCameraBtn" disabled>Stop camera</button>
            </div>
          </div>

          <div id="conversation" class="conversation"></div>

          <div class="text-entry">
            <input id="textInput" type="text" placeholder="Type if you prefer" disabled>
            <button id="sendTextBtn" disabled>Send</button>
          </div>
        </section>

        <section class="panel">
          <h2>Task state</h2>
          <div id="tasks" class="tasks"></div>

          <h2>Live events</h2>
          <div id="events" class="events"></div>
        </section>
      </div>
    </main>

    <script>
      const connectBtn = document.getElementById("connectBtn");
      const disconnectBtn = document.getElementById("disconnectBtn");
      const sendTextBtn = document.getElementById("sendTextBtn");
      const textInput = document.getElementById("textInput");
      const voiceSelect = document.getElementById("voiceSelect");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const startCameraBtn = document.getElementById("startCameraBtn");
      const stopCameraBtn = document.getElementById("stopCameraBtn");
      const cameraStatus = document.getElementById("cameraStatus");
      const cameraStage = document.getElementById("cameraStage");
      const cameraPreview = document.getElementById("cameraPreview");
      const cameraCanvas = document.getElementById("cameraCanvas");
      const conversation = document.getElementById("conversation");
      const tasks = document.getElementById("tasks");
      const events = document.getElementById("events");

      let socket = null;
      let audioContext = null;
      let playbackContext = null;
      let mediaStream = null;
      let mediaSource = null;
      let processor = null;
      let playbackCursor = 0;
      let assistantSpeakingUntil = 0;
      let microphoneBlockedByAssistant = false;
      let assistantPlaybackTimer = null;
      let assistantTurnActive = false;
      let assistantResponseComplete = false;
      let speaking = false;
      let silenceFrames = 0;
      let speechFrames = 0;
      let disconnecting = false;
      let noiseFloor = 0.003;
      let calibratedFrames = 0;
      let pendingTailFrames = 0;
      let preSpeechChunks = [];
      let cameraStream = null;
      let cameraFrameTimer = null;
      let cameraFrameCount = 0;
      const CALIBRATION_FRAMES = 12;
      const MIN_NOISE_FLOOR = 0.0025;
      const SPEECH_RATIO = 2.0;
      const MIN_SPEECH_RMS = 0.008;
      const REQUIRED_SPEECH_FRAMES = 2;
      const SILENCE_FRAME_LIMIT = 14;
      const PRE_SPEECH_CHUNKS = 6;
      const POST_SPEECH_CHUNKS = 4;
      const CAMERA_FRAME_INTERVAL_MS = 2000;

      function setStatus(text, connected) {
        statusText.textContent = text;
        statusDot.classList.toggle("live", connected);
      }

      function updateLiveState() {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          setStatus("Disconnected", false);
          return;
        }

        if (disconnecting) {
          setStatus("Stopping...", false);
          return;
        }

        if (assistantTurnActive || microphoneBlockedByAssistant) {
          setStatus("Assistant speaking", true);
          return;
        }

        if (speaking) {
          setStatus("Listening to you", true);
          return;
        }

        setStatus("Ready for you", true);
      }

      function setConnectionButtons({ connecting = false, connected = false, stopping = false } = {}) {
        connectBtn.disabled = connecting || connected || stopping;
        disconnectBtn.disabled = !connected && !stopping;
        voiceSelect.disabled = connecting || connected || stopping;
        sendTextBtn.disabled = !connected || stopping;
        textInput.disabled = !connected || stopping;
        startCameraBtn.disabled = !connected || stopping || Boolean(cameraStream);
        stopCameraBtn.disabled = stopping || !cameraStream;
      }

      function addBubble(role, text) {
        const node = document.createElement("div");
        node.className = `bubble ${role}`;
        node.textContent = text;
        conversation.appendChild(node);
        conversation.scrollTop = conversation.scrollHeight;
      }

      function addEvent(text) {
        const node = document.createElement("div");
        node.className = "meta";
        node.textContent = text;
        events.appendChild(node);
        events.scrollTop = events.scrollHeight;
      }

      function renderTasks(toolResult) {
        if (toolResult.name === "search_web") {
          tasks.innerHTML = "";
          const results = toolResult.result.results || [];
          if (!results.length) {
            const empty = document.createElement("div");
            empty.className = "task";
            empty.textContent = toolResult.result.message || "No web results.";
            tasks.appendChild(empty);
            return;
          }
          for (const item of results) {
            const card = document.createElement("div");
            card.className = "task";
            card.innerHTML = `
              <strong>${item.title}</strong><br>
              <span class="meta">${item.source}</span><br>
              <div>${item.snippet}</div>
              <div><a href="${item.url}" target="_blank" rel="noreferrer">${item.url}</a></div>
            `;
            tasks.appendChild(card);
          }
          return;
        }

        if (toolResult.name === "list_tasks") {
          tasks.innerHTML = "";
          const list = toolResult.result.tasks || [];
          if (!list.length) {
            const empty = document.createElement("div");
            empty.className = "task";
            empty.textContent = "No open tasks.";
            tasks.appendChild(empty);
          }
          for (const task of list) {
            const card = document.createElement("div");
            card.className = "task";
            card.textContent = `${task.id}. ${task.title} (${task.status})`;
            tasks.appendChild(card);
          }
          return;
        }

        if (["add_task", "complete_task", "delete_task", "clear_completed"].includes(toolResult.name)) {
          const card = document.createElement("div");
          card.className = "task";
          card.textContent = `${toolResult.name}: ${JSON.stringify(toolResult.result)}`;
          tasks.prepend(card);
        }
      }

      function decodeBase64ToInt16(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new Int16Array(bytes.buffer);
      }

      function playPcm16(base64, sampleRate = 24000) {
        if (!playbackContext) {
          playbackContext = new AudioContext();
          playbackCursor = playbackContext.currentTime;
        }

        const pcm = decodeBase64ToInt16(base64);
        const audioBuffer = playbackContext.createBuffer(1, pcm.length, sampleRate);
        const channel = audioBuffer.getChannelData(0);
        for (let i = 0; i < pcm.length; i += 1) {
          channel[i] = pcm[i] / 32768;
        }

        const source = playbackContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(playbackContext.destination);
        const startAt = Math.max(playbackContext.currentTime, playbackCursor);
        source.start(startAt);
        playbackCursor = startAt + audioBuffer.duration;
        assistantSpeakingUntil = Math.max(assistantSpeakingUntil, playbackCursor + 0.25);
        assistantTurnActive = true;
        assistantResponseComplete = false;
        syncAssistantPlaybackBlock();
        updateLiveState();
      }

      function resetVoiceDetection() {
        speaking = false;
        silenceFrames = 0;
        speechFrames = 0;
        pendingTailFrames = 0;
        preSpeechChunks = [];
        calibratedFrames = 0;
        noiseFloor = MIN_NOISE_FLOOR;
      }

      function closeUserSpeechTurn(reason) {
        if (!speaking) {
          silenceFrames = 0;
          speechFrames = 0;
          pendingTailFrames = 0;
          preSpeechChunks = [];
          return;
        }

        speaking = false;
        silenceFrames = 0;
        speechFrames = 0;
        pendingTailFrames = 0;
        preSpeechChunks = [];
        if (socket && socket.readyState === WebSocket.OPEN && !disconnecting) {
          socket.send(JSON.stringify({ type: "activity_end" }));
        }
        addEvent(reason);
        updateLiveState();
      }

      function setMicrophoneBlocked(blocked) {
        const changed = microphoneBlockedByAssistant !== blocked;
        microphoneBlockedByAssistant = blocked;
        if (!mediaStream) {
          updateLiveState();
          return;
        }
        for (const track of mediaStream.getAudioTracks()) {
          track.enabled = !blocked;
        }
        if (changed && !blocked) {
          resetVoiceDetection();
          addEvent("Microphone ready for your next request.");
        }
        updateLiveState();
      }

      function syncAssistantPlaybackBlock() {
        if (assistantPlaybackTimer) {
          window.clearTimeout(assistantPlaybackTimer);
          assistantPlaybackTimer = null;
        }

        if (!playbackContext || playbackContext.state === "closed") {
          if (assistantResponseComplete) {
            assistantTurnActive = false;
          }
          setMicrophoneBlocked(false);
          return;
        }

        const remainingMs = Math.max(0, (assistantSpeakingUntil - playbackContext.currentTime) * 1000);
        if (remainingMs <= 0) {
          if (assistantResponseComplete) {
            assistantTurnActive = false;
            setMicrophoneBlocked(false);
          }
          return;
        }

        if (!microphoneBlockedByAssistant) {
          closeUserSpeechTurn("Paused mic while assistant audio was playing.");
          setMicrophoneBlocked(true);
        }

        assistantPlaybackTimer = window.setTimeout(() => {
          assistantPlaybackTimer = null;
          syncAssistantPlaybackBlock();
        }, remainingMs + 60);
      }

      function floatTo16BitPCM(input) {
        const output = new Int16Array(input.length);
        for (let i = 0; i < input.length; i += 1) {
          const value = Math.max(-1, Math.min(1, input[i]));
          output[i] = value < 0 ? value * 32768 : value * 32767;
        }
        return output;
      }

      function downsampleBuffer(buffer, inputRate, outputRate) {
        if (inputRate === outputRate) {
          return buffer;
        }
        const ratio = inputRate / outputRate;
        const newLength = Math.round(buffer.length / ratio);
        const result = new Float32Array(newLength);
        let offsetResult = 0;
        let offsetBuffer = 0;

        while (offsetResult < result.length) {
          const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
          let accum = 0;
          let count = 0;
          for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i += 1) {
            accum += buffer[i];
            count += 1;
          }
          result[offsetResult] = accum / count;
          offsetResult += 1;
          offsetBuffer = nextOffsetBuffer;
        }
        return result;
      }

      function int16ToBase64(int16) {
        const bytes = new Uint8Array(int16.buffer);
        let binary = "";
        for (let i = 0; i < bytes.byteLength; i += 1) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      function calculateRms(samples) {
        let sumSquares = 0;
        for (let i = 0; i < samples.length; i += 1) {
          sumSquares += samples[i] * samples[i];
        }
        return Math.sqrt(sumSquares / samples.length);
      }

      function sendAudioChunk(base64Audio) {
        if (!socket || socket.readyState !== WebSocket.OPEN || disconnecting) {
          return;
        }
        socket.send(JSON.stringify({ type: "audio", data: base64Audio }));
      }

      function sendCameraFrame() {
        if (
          !cameraStream ||
          !socket ||
          socket.readyState !== WebSocket.OPEN ||
          disconnecting ||
          cameraPreview.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          return;
        }

        const sourceWidth = cameraPreview.videoWidth;
        const sourceHeight = cameraPreview.videoHeight;
        if (!sourceWidth || !sourceHeight) {
          return;
        }

        const scale = Math.min(1, 640 / sourceWidth);
        cameraCanvas.width = Math.round(sourceWidth * scale);
        cameraCanvas.height = Math.round(sourceHeight * scale);
        const context = cameraCanvas.getContext("2d", { alpha: false });
        context.drawImage(cameraPreview, 0, 0, cameraCanvas.width, cameraCanvas.height);
        const dataUrl = cameraCanvas.toDataURL("image/jpeg", 0.72);
        socket.send(JSON.stringify({
          type: "video",
          mime_type: "image/jpeg",
          data: dataUrl.split(",", 2)[1]
        }));
        cameraFrameCount += 1;
        cameraStatus.textContent = `Camera on · frame ${cameraFrameCount}`;
      }

      async function startCamera() {
        if (cameraStream || !socket || socket.readyState !== WebSocket.OPEN) {
          return;
        }

        startCameraBtn.disabled = true;
        cameraStatus.textContent = "Requesting camera…";
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 640 },
              height: { ideal: 480 }
            },
            audio: false
          });
          cameraPreview.srcObject = cameraStream;
          await cameraPreview.play();
          cameraFrameCount = 0;
          cameraStage.classList.add("active");
          cameraStatus.textContent = "Camera on";
          cameraFrameTimer = window.setInterval(sendCameraFrame, CAMERA_FRAME_INTERVAL_MS);
          sendCameraFrame();
          addEvent("Camera started. Ask what the assistant sees.");
        } catch (error) {
          cameraStream = null;
          cameraStatus.textContent = "Camera unavailable";
          addEvent(`Could not start camera: ${error.message}`);
        }
        setConnectionButtons({ connected: socket && socket.readyState === WebSocket.OPEN });
      }

      function stopCamera(showEvent = true) {
        if (cameraFrameTimer) {
          window.clearInterval(cameraFrameTimer);
          cameraFrameTimer = null;
        }
        if (cameraStream) {
          for (const track of cameraStream.getTracks()) {
            track.stop();
          }
        }
        cameraStream = null;
        cameraPreview.srcObject = null;
        cameraStage.classList.remove("active");
        cameraStatus.textContent = "Camera off";
        cameraFrameCount = 0;
        if (showEvent) {
          addEvent("Camera stopped.");
        }
        setConnectionButtons({
          connected: Boolean(socket && socket.readyState === WebSocket.OPEN && !disconnecting),
          stopping: disconnecting
        });
      }

      async function startMicrophone() {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        audioContext = new AudioContext();
        mediaSource = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(2048, 1, 1);
        calibratedFrames = 0;
        noiseFloor = MIN_NOISE_FLOOR;
        speechFrames = 0;
        silenceFrames = 0;
        speaking = false;
        pendingTailFrames = 0;
        preSpeechChunks = [];

        processor.onaudioprocess = (event) => {
          if (!socket || socket.readyState !== WebSocket.OPEN || disconnecting) {
            return;
          }

          if (microphoneBlockedByAssistant) {
            return;
          }

          const input = event.inputBuffer.getChannelData(0);
          const rms = calculateRms(input);

          if (!speaking) {
            if (calibratedFrames < CALIBRATION_FRAMES) {
              noiseFloor = Math.max(MIN_NOISE_FLOOR, (noiseFloor * calibratedFrames + rms) / (calibratedFrames + 1));
              calibratedFrames += 1;
            } else {
              noiseFloor = Math.max(MIN_NOISE_FLOOR, noiseFloor * 0.98 + rms * 0.02);
            }
          }

          const dynamicThreshold = Math.max(MIN_SPEECH_RMS, noiseFloor * SPEECH_RATIO);
          const speechDetected = rms >= dynamicThreshold;

          if (speechDetected) {
            silenceFrames = 0;
            speechFrames += 1;
            if (!speaking && speechFrames >= REQUIRED_SPEECH_FRAMES) {
              speaking = true;
              pendingTailFrames = 0;
              socket.send(JSON.stringify({ type: "activity_start" }));
              addEvent("Speech detected.");
              updateLiveState();
            }
          } else {
            speechFrames = 0;
            if (speaking) {
              silenceFrames += 1;
              if (silenceFrames >= SILENCE_FRAME_LIMIT) {
                speaking = false;
                silenceFrames = 0;
                pendingTailFrames = POST_SPEECH_CHUNKS;
              }
            }
          }

          const downsampled = downsampleBuffer(input, audioContext.sampleRate, 16000);
          const pcm16 = floatTo16BitPCM(downsampled);
          const base64Audio = int16ToBase64(pcm16);
          preSpeechChunks.push(base64Audio);
          if (preSpeechChunks.length > PRE_SPEECH_CHUNKS) {
            preSpeechChunks.shift();
          }

          if (speaking) {
            if (speechFrames === REQUIRED_SPEECH_FRAMES) {
              for (const chunk of preSpeechChunks) {
                sendAudioChunk(chunk);
              }
              preSpeechChunks = [];
            }
            sendAudioChunk(base64Audio);
            return;
          }

          if (pendingTailFrames > 0) {
            sendAudioChunk(base64Audio);
            pendingTailFrames -= 1;
            if (pendingTailFrames === 0) {
              socket.send(JSON.stringify({ type: "activity_end" }));
              addEvent("Speech segment ended.");
              preSpeechChunks = [];
            }
          }
        };

        mediaSource.connect(processor);
        processor.connect(audioContext.destination);
      }

      function stopMicrophone() {
        speaking = false;
        silenceFrames = 0;
        speechFrames = 0;
        calibratedFrames = 0;
        pendingTailFrames = 0;
        preSpeechChunks = [];
        assistantTurnActive = false;
        assistantResponseComplete = false;
        setMicrophoneBlocked(false);
        if (assistantPlaybackTimer) {
          window.clearTimeout(assistantPlaybackTimer);
          assistantPlaybackTimer = null;
        }
        if (processor) {
          processor.disconnect();
          processor = null;
        }
        if (mediaSource) {
          mediaSource.disconnect();
          mediaSource = null;
        }
        if (mediaStream) {
          for (const track of mediaStream.getTracks()) {
            track.stop();
          }
          mediaStream = null;
        }
        if (audioContext) {
          audioContext.close();
          audioContext = null;
        }
        updateLiveState();
      }

      function stopPlayback() {
        playbackCursor = 0;
        assistantSpeakingUntil = 0;
        assistantResponseComplete = false;
        if (!assistantTurnActive) {
          setMicrophoneBlocked(false);
        }
        if (assistantPlaybackTimer) {
          window.clearTimeout(assistantPlaybackTimer);
          assistantPlaybackTimer = null;
        }
        if (playbackContext && playbackContext.state !== "closed") {
          playbackContext.close();
        }
        playbackContext = null;
        updateLiveState();
      }

      function finalizeDisconnect(message) {
        stopCamera(false);
        stopMicrophone();
        stopPlayback();
        socket = null;
        disconnecting = false;
        setStatus("Disconnected", false);
        setConnectionButtons({ connected: false });
        addEvent(message);
      }

      async function connect() {
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        disconnecting = false;
        socket = new WebSocket(`${protocol}://${window.location.host}/ws/live`);
        setStatus("Connecting...", false);
        setConnectionButtons({ connecting: true });

        socket.onopen = async () => {
          socket.send(JSON.stringify({ type: "config", voice: voiceSelect.value }));
          await startMicrophone();
          setConnectionButtons({ connected: true });
          addEvent("Microphone streaming started.");
          updateLiveState();
        };

        socket.onmessage = (event) => {
          const payload = JSON.parse(event.data);
          if (payload.type === "input_transcript") {
            if (payload.finished && payload.text) {
              addBubble("user", payload.text);
            }
          } else if (payload.type === "output_transcript") {
            if (payload.finished && payload.text) {
              addBubble("assistant", payload.text);
            }
          } else if (payload.type === "assistant_text") {
            addEvent(`Assistant text: ${payload.text}`);
          } else if (payload.type === "tool_result") {
            addEvent(`Tool ${payload.name}: ${JSON.stringify(payload.result)}`);
            renderTasks(payload);
          } else if (payload.type === "audio") {
            playPcm16(payload.data);
          } else if (payload.type === "turn_complete") {
            assistantResponseComplete = true;
            syncAssistantPlaybackBlock();
            addEvent("Response received; waiting for audio playback to finish.");
          } else if (payload.type === "error") {
            addEvent(`Error: ${payload.message}`);
          }
        };

        socket.onerror = (event) => {
          console.error("WebSocket error", event);
          addEvent("WebSocket error. Check the browser console and server terminal.");
        };

        socket.onclose = (event) => {
          finalizeDisconnect(`Conversation stopped. Code=${event.code} Reason=${event.reason || "none"}`);
        };
      }

      function disconnect() {
        if (disconnecting) {
          return;
        }

        disconnecting = true;
        setStatus("Stopping...", false);
        setConnectionButtons({ stopping: true });
        stopCamera(false);
        stopMicrophone();

        if (!socket) {
          finalizeDisconnect("Conversation stopped locally.");
          return;
        }

        if (socket.readyState === WebSocket.OPEN) {
          window.setTimeout(() => {
            if (socket && socket.readyState !== WebSocket.CLOSED) {
              socket.close(1000, "Stopped by user");
            }
          }, 50);
          return;
        }

        if (socket.readyState === WebSocket.CONNECTING) {
          socket.close(1000, "Stopped during connect");
          return;
        }

        finalizeDisconnect("Conversation stopped locally.");
      }

      connectBtn.addEventListener("click", connect);
      disconnectBtn.addEventListener("click", disconnect);
      startCameraBtn.addEventListener("click", startCamera);
      stopCameraBtn.addEventListener("click", () => stopCamera());
      sendTextBtn.addEventListener("click", () => {
        if (!socket || socket.readyState !== WebSocket.OPEN || disconnecting) {
          return;
        }

        const text = textInput.value.trim();
        if (!text) {
          return;
        }

        addBubble("user", text);
        socket.send(JSON.stringify({ type: "text", text }));
        textInput.value = "";
      });
      textInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendTextBtn.click();
        }
      });
    </script>
  </body>
</html>
